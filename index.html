<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>星纹叙事台 Stellar‑Weave Stage 星紋叙事ステージ</title>
<script src="./jszip.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{
  height:100%;
  font-size:17px;
}
body{
  font-family: system-ui, -apple-system, "Microsoft Yahei", sans-serif;
  background:#ffffff;
  color:#222222;
  padding:20px;
  padding-bottom:20px;
  max-width:1000px;
  margin:0 auto;
  position:relative;
}
.page{
  display:none;
  height:100%;
}
.page.active{
  display:block;
}
.tip{
  text-align:center;
  color:#666;
  margin-bottom:15px;
  font-size:16px;
}
.btns{
  display:flex;
  gap:10px;
  justify-content:center;
  margin-bottom:20px;
  flex-wrap:wrap;
  align-items:center;
}
button{
  padding:12px 20px;
  font-size:17px;
  border:none;
  border-radius:8px;
  background:#366ed8;
  color:white;
  cursor:pointer;
  transition:0.2s;
  -webkit-tap-highlight-color: transparent;
}
button:active{background:#2857b0;}

.character-layer{
  position:fixed;
  left:0;
  top:0;
  width:42vw;
  z-index:5;
  pointer-events:none;
  overflow:hidden;
}
.character-layer img{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:auto;
  min-height:80px;
  max-height:70vh;
  object-fit:contain;
  object-position:left top;
  display:block;
}

#storyBox{
  background:rgba(245,245,245,0.12);
  padding:26px;
  border-radius:10px;
  min-height:240px;
  line-height:1.85;
  font-size:18px;
  position:absolute;
  bottom:20px;
  left:20px;
  right:20px;
  max-width:calc(1000px - 40px);
  margin:0 auto;
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(6px);
  box-shadow:0 4px 20px rgba(0,0,0,0.25);
  z-index:10;
}
.speaker{
  color:#2b5cb8;
  font-weight:bold;
  margin-bottom:6px;
  font-size:19px;
}
.narration{
  color:#555555;
  margin:12px 0;
  font-size:17px;
}
.choice-area{
  margin-top:22px;
  display:flex;
  flex-direction:column;
  gap:12px;
}
.choice-btn{
  background:#e8edf7;
  color:#222;
  text-align:left;
  font-size:17px;
  padding:14px 16px;
}
.choice-btn:active{background:#d0d9ec;}
#nextBtn{
  position:absolute;
  bottom:calc(240px + 44px);
  right:20px;
  margin:0;
  z-index:11;
}
#exitBtn{
  background:#bb3333;
  position:absolute;
  bottom:20px;
  left:20px;
  z-index:11;
}
#exitBtn:active{background:#992222;}
#fullBtn{
  background:#22aa66;
}
#fullBtn:active{background:#19884f;}
#exitFullBtn{
  background:#9055cc;
}
#exitFullBtn:active{background:#7440aa;}
#clearSaveBtn{
  background:#ed8b27;
}
#clearSaveBtn:active{
  background:#c4701c;
}
#exitFullWrap{
  position:fixed;
  top:12px;
  right:12px;
  z-index:999;
}
#iosTip{
  position:fixed;
  top:12px;
  left:12px;
  z-index:999;
  background:#ffeeee;
  color:#992222;
  padding:8px 10px;
  border-radius:6px;
  font-size:14px;
  display:none;
}
#bgmPlayBtn{
  position:fixed;
  bottom:280px;
  left:20px;
  z-index:99;
  background:#118877;
}
#bgmPlayBtn:active{
  background:#0c6659;
}
.copyright{
  margin-top:30px;
  text-align:center;
  font-size:14px;
  color:#888;
}
.restart-btn{
  background:#6b7280;
}
.restart-btn:active{
  background:#4b5563;
}
.import-export-btn{
  background:#279ed8;
}
.import-export-btn:active{
  background:#1b7cae;
}
.file-input{
  display:none;
}
select.lang-select{
  font-size:17px;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  background:#fff;
}
</style>
</head>
<body>
<div id="iosTip"></div>
<div id="exitFullWrap">
  <button id="exitFullBtn" onclick="exitFull()" data-ui-key="btnExitFull"></button>
</div>
<div class="character-layer" id="charLayer"></div>
<div id="menuPage" class="page active">
  <h1 data-ui-key="title"></h1>
  <div class="tip" data-ui-key="tipRotate"></div>
  <div class="btns">
    <label data-ui-key="langLabel"></label>
    <select id="langSelect" class="lang-select" onchange="onLangSelectChange(this.value)">
      <option value="zh" data-ui-key="langZh"></option>
      <option value="en" data-ui-key="langEn"></option>
      <option value="ja" data-ui-key="langJa"></option>
    </select>
  </div>
  <div class="btns">
    <button id="fullBtn" onclick="toggleFull()" data-ui-key="btnFull"></button>
    <button id="clearSaveBtn" onclick="clearSave()" data-ui-key="btnClearSave"></button>
  </div>
  <!-- 自动渲染幕按钮容器，HTML永远不需要修改 -->
  <div class="btns" id="continueBtnWrap"></div>
  <div class="btns" id="restartBtnWrap"></div>
  <div class="btns">
    <button onclick="resumeScene()" data-ui-key="btnResume"></button>
  </div>
  <div class="btns">
    <button class="import-export-btn" onclick="exportSave()" data-ui-key="btnExport"></button>
    <button class="import-export-btn" onclick="document.getElementById('saveImport').click()" data-ui-key="btnImport"></button>
    <input class="file-input" type="file" id="saveImport" accept=".txt" onchange="importSave(this)">
    <button class="import-export-btn" onclick="document.getElementById('zipUpload').click()" data-ui-key="btnLoadZip"></button>
    <input class="file-input" type="file" id="zipUpload" accept=".zip" onchange="loadResourceZip(this)">
  </div>
  <div class="tip" id="saveTip"></div>
  <div class="copyright" data-ui-key="copyright"></div>
</div>
<div id="storyPage" class="page">
  <button id="bgmPlayBtn" onclick="triggerBGMPlay()" style="display:none;" data-ui-key="btnBgm"></button>
  <button id="nextBtn" onclick="next()" style="display:none;" data-ui-key="btnNext"></button>
  <div id="storyBox"></div>
  <button id="exitBtn" onclick="exitStory()" data-ui-key="btnExitStory"></button>
  <div class="copyright" data-ui-key="copyright"></div>
</div>
<script>
const uiLocale = {
  zh:{
    title:"星纹叙事台",
    tipRotate:"请将手机横向放置，点击「进入全屏」",
    btnFull:"进入全屏",
    btnClearSave:"清除存档",
    btnResume:"继续上次进度",
    btnNext:"继续▶",
    suffixContinue:"（继续进度）",
    suffixRestart:"【从头开始】",
    btnExport:"导出存档",
    btnImport:"导入存档",
    btnLoadZip:"加载资源包ZIP",
    btnExitFull:"退出全屏",
    btnExitStory:"退出剧情",
    btnBgm:"开启背景音乐",
    tipIos:"由于苹果限制，部分安卓有的功能无法使用",
    tipNoSave:"没有存档",
    tipParseFail:"存档文件解析失败",
    tipImportOk:"存档导入成功！",
    tipZipNoMap:"资源包缺少 res_map.json",
    tipZipSuccess:"资源包加载成功，共{count}个文件，字体已生效",
    tipZipLoadFail:"资源包读取失败：",
    tipJsonLoadFail:"文件 {fileName} 读取失败，自动切回中文\n{errMsg}",
    textPleaseChoose:"请选择：",
    storyEnd:"剧情全部读完。",
    copyright:"由巧秋072、灵进行代码、剧本制作测试，Version beta0.5，仅供个人娱乐，非盈利、商用，勿传播。剧情角色为虚构，无现实原型。请遵守GitHub仓库声明。",
    langLabel:"语言：",
    langZh:"中文",
    langEn:"English",
    langJa:"日本語"
  },
  en:{
    title:"Stellar Weave Stage",
    tipRotate:"Please rotate your phone to landscape and click Enter Fullscreen",
    btnFull:"Enter Fullscreen",
    btnClearSave:"Clear Save",
    btnResume:"Resume Last Progress",
    btnNext:"Next ▶",
    suffixContinue:" (Resume)",
    suffixRestart:" [Restart from beginning]",
    btnExport:"Export Save",
    btnImport:"Import Save",
    btnLoadZip:"Load Resource ZIP",
    btnExitFull:"Exit Fullscreen",
    btnExitStory:"Exit Story",
    btnBgm:"Turn On BGM",
    tipIos:"Due to iOS limitations, some Android‑only features unavailable",
    tipNoSave:"No save file",
    tipParseFail:"Failed to parse save file",
    tipImportOk:"Save imported successfully!",
    tipZipNoMap:"Resource pack missing res_map.json",
    tipZipSuccess:"Resource pack loaded, {count} files total, font applied",
    tipZipLoadFail:"Resource package load failed: ",
    tipJsonLoadFail:"File {fileName} load failed, fallback to Chinese\n{errMsg}",
    textPleaseChoose:"Please choose:",
    storyEnd:"Story complete.",
    copyright:"Created by qiaoqiu072 & Ling. Beta0.5, for personal entertainment only. Non‑commercial.",
    langLabel:"Language:",
    langZh:"中文",
    langEn:"English",
    langJa:"日本語"
  },
  ja:{
    title:"星紋叙事ステージ",
    tipRotate:"スマホを横にして「フルスクリーン」を押してください",
    btnFull:"フルスクリーン",
    btnClearSave:"セーブ削除",
    btnResume:"前回の続き",
    btnNext:"次へ▶",
    suffixContinue:"（続きから）",
    suffixRestart:"【最初から】",
    btnExport:"セーブ出力",
    btnImport:"セーブ読込",
    btnLoadZip:"リソースZIP読込",
    btnExitFull:"フルスクリーン解除",
    btnExitStory:"シナリオ終了",
    btnBgm:"BGMオン",
    tipIos:"iOS制限によりAndroid機能の一部が使用不可",
    tipNoSave:"セーブデータがありません",
    tipParseFail:"セーブ解析失敗",
    tipImportOk:"セーブインポート完了",
    tipZipNoMap:"res_map.jsonがありません",
    tipZipSuccess:"リソース読込完了、{count}ファイル、フォント適用",
    tipZipLoadFail:"リソース読み込み失敗：",
    tipJsonLoadFail:"ファイル {fileName} 読み込み失敗、中国語に切り替えます\n{errMsg}",
    textPleaseChoose:"選択してください：",
    storyEnd:"シナリオ終了",
    copyright:"制作：巧秋072、灵。beta0.5、個人利用のみ、商用禁止。",
    langLabel:"言語：",
    langZh:"中文",
    langEn:"English",
    langJa:"日本語"
  }
};
let currentLang = "zh";
let scenes = {};
let characterLayoutTimer = null;

function renderSceneButtons(){
  const continueWrap = document.getElementById("continueBtnWrap");
  const restartWrap = document.getElementById("restartBtnWrap");
  console.log("continueWrap", continueWrap, "scenes", scenes);

  if (!continueWrap || !restartWrap) {
    console.error("找不到按钮容器 continueBtnWrap / restartBtnWrap");
    return;
  }
  if (!scenes || typeof scenes !== "object") {
    continueWrap.innerHTML = "<div class='tip'>剧本数据未加载</div>";
    return;
  }

  continueWrap.innerHTML = "";
  restartWrap.innerHTML = "";
  const dict = uiLocale[currentLang];

  const sceneKeys = Object.keys(scenes)
    .filter(k => k.startsWith("scene"))
    .sort((a,b)=>{
      const n1 = Number(a.replace("scene",""));
      const n2 = Number(b.replace("scene",""));
      return n1 - n2;
    });

  console.log("识别到的幕列表", sceneKeys);
  if(sceneKeys.length === 0){
    continueWrap.innerHTML = "<div class='tip'>未检测到任何scene剧本</div>";
    return;
  }

  for(const sid of sceneKeys){
    const sceneItem = scenes[sid];
    const titleText = sceneItem?.title || sid;
    const btnContinue = document.createElement("button");
    btnContinue.textContent = `${titleText}${dict.suffixContinue}`;
    btnContinue.onclick = ()=> startScene(sid);
    continueWrap.appendChild(btnContinue);

    const btnRestart = document.createElement("button");
    btnRestart.className = "restart-btn";
    btnRestart.textContent = `${titleText}${dict.suffixRestart}`;
    btnRestart.onclick = ()=> startSceneFromBegin(sid);
    restartWrap.appendChild(btnRestart);
  }
}

function detectBrowserLanguage(){
  const navLang = navigator.language || navigator.userLanguage;
  if(navLang.startsWith("zh")) return "zh";
  if(navLang.startsWith("en")) return "en";
  if(navLang.startsWith("ja")) return "ja";
  return "zh";
}

async function onLangSelectChange(newLang){
  await changeLanguage(newLang);
}

function applyUiLocale(){
  const dict = uiLocale[currentLang];
  document.querySelectorAll("[data-ui-key]").forEach(el=>{
    const key = el.getAttribute("data-ui-key");
    if(!dict[key]) return;
    if(el.tagName === "OPTION"){
      el.textContent = dict[key];
    }else{
      el.innerText = dict[key];
    }
  })
  iosTipDom.innerText = dict.tipIos;
  document.getElementById("langSelect").value = currentLang;
}

async function loadSceneJson(lang){
  try{
    const res = await fetch(`scenes_${lang}.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    scenes = await res.json();
  }catch(err){
    console.error("剧本JSON加载失败", err);
    const dict = uiLocale[currentLang];
    const msg = dict.tipJsonLoadFail
      .replace("{fileName}",`scenes_${lang}.json`)
      .replace("{errMsg}",err.message);
    alert(msg);
    currentLang = "zh";
    await loadSceneJson("zh");
  }
}

async function changeLanguage(newLang){
  currentLang = newLang;
  await loadSceneJson(newLang);
  applyUiLocale();
  renderSceneButtons();

  if(document.getElementById("storyPage").classList.contains("active")){
    render();
  }

  if(isIOS){
    setCookie("ui_lang", newLang);
  }else{
    localStorage.setItem("ui_lang", newLang);
  }
}

let sceneId = null;
let sceneData = null;
let index = 0;
let resourcePack = {
  loaded: false,
  files: {},
  map: {},
  bgmAudio: null,
  segmentVoiceAudio: null
};
let bgLayer = null;
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const iosTipDom = document.getElementById("iosTip");
const charLayerDom = document.getElementById("charLayer");
if(isIOS){
  iosTipDom.style.display = "block";
}
const BGM_NORMAL_VOLUME = 0.7;
const BGM_DUCK_VOLUME = 0.25;

function setCookie(name,value,days=365){
  let d = new Date();
  d.setTime(d.getTime() + (days*24*60*60*1000));
  document.cookie = name + "=" + encodeURIComponent(value) + ";expires="+ d.toUTCString() + ";path=/";
}
function getCookie(name){
  let arr = document.cookie.split('; ');
  for(let i=0;i<arr.length;i++){
    let item = arr[i].split('=');
    if(item[0] === name) return decodeURIComponent(item[1]);
  }
  return null;
}
function loadProgress(){
  let savedRaw;
  if(isIOS){
    savedRaw = getCookie("storyProgress");
  }else{
    savedRaw = localStorage.getItem("storyProgress");
  }
  if(savedRaw){
    const p = JSON.parse(savedRaw);
    document.getElementById("saveTip").innerText = `上次读到：${scenes[p.sceneId]?.title||""}，第${p.index+1}段`;
    return p;
  }else{
    document.getElementById("saveTip").innerText = "";
    return null;
  }
}
function saveProgress(){
  const saveData = JSON.stringify({sceneId, index});
  if(isIOS){
    setCookie("storyProgress", saveData);
  }else{
    localStorage.setItem("storyProgress", saveData);
  }
}
function clearSave(){
  if(isIOS){
    setCookie("storyProgress","",-1);
  }else{
    localStorage.removeItem("storyProgress");
  }
  loadProgress();
}
function toggleFull(){
  const docEl = document.documentElement;
  if (!document.fullscreenElement){
    docEl.requestFullscreen?.() || docEl.webkitRequestFullscreen?.();
  }
}
function exitFull(){
  if(document.fullscreenElement){
    document.exitFullscreen?.() || document.webkitExitFullscreen?.();
  }
}
function initBgLayer(){
  if(bgLayer) return;
  bgLayer = document.createElement("div");
  bgLayer.style.position = "fixed";
  bgLayer.style.inset = "0";
  bgLayer.style.zIndex = "-1";
  bgLayer.style.backgroundSize = "cover";
  bgLayer.style.backgroundPosition = "center";
  bgLayer.style.backgroundRepeat = "no‑repeat";
  bgLayer.style.transition = "background‑image 0.3s ease";
  document.body.appendChild(bgLayer);
}
function clearBgLayer(){
  if(bgLayer){
    bgLayer.style.backgroundImage = "none";
  }
}
function clearCharacterImage(){
  charLayerDom.innerHTML = "";
}

function updateCharacterLayout(){
  const box = document.getElementById("storyBox");
  const layer = document.getElementById("charLayer");
  if(!box || !layer) return;

  if(!document.getElementById("storyPage").classList.contains("active")){
    layer.style.height = "";
    layer.style.width = "";
    return;
  }

  const boxRect = box.getBoundingClientRect();
  let layerHeight = Math.max(120, boxRect.top - 10);

  if(window.innerWidth > window.innerHeight){
    layerHeight = Math.min(layerHeight, window.innerHeight * 0.55);
  }

  layer.style.height = layerHeight + "px";
  layer.style.width = "42vw";

  const img = layer.querySelector("img");
  if(img){
    img.style.maxHeight = layerHeight + "px";
    img.style.minHeight = "80px";
    img.style.height = "auto";
    img.style.width = "100%";
    img.style.objectFit = "contain";
    img.style.objectPosition = "left top";
  }
}

function startCharacterLayoutWatch(){
  stopCharacterLayoutWatch();
  updateCharacterLayout();
  characterLayoutTimer = setInterval(()=>{
    updateCharacterLayout();
  }, 120);
}

function stopCharacterLayoutWatch(){
  if(characterLayoutTimer){
    clearInterval(characterLayoutTimer);
    characterLayoutTimer = null;
  }
}

window.addEventListener("resize", updateCharacterLayout);
window.addEventListener("orientationchange", ()=>{
  setTimeout(updateCharacterLayout, 120);
});

function getCharUrlBySpeaker(item){
  if(!resourcePack.loaded) return null;
  if(item.charKey){
    return resourcePack.map?.speakerToChar?.[item.charKey] || null;
  }
  if(item.speaker){
    return resourcePack.map?.speakerToChar?.[item.speaker] || null;
  }
  return null;
}
function setCharacter(item){
  clearCharacterImage();
  const filePath = getCharUrlBySpeaker(item);
  if(!filePath) return;
  const imgUrl = resourcePack.files[filePath];
  if(!imgUrl) return;

  const img = new Image();
  img.src = imgUrl;
  img.onload = ()=>{
    charLayerDom.appendChild(img);
    startCharacterLayoutWatch();
  };
}
function getVoiceUrlByIndex(idx){
  if(!resourcePack.loaded) return null;
  const voicePath = resourcePack.map?.indexVoice?.[String(idx)];
  if(!voicePath) return null;
  return resourcePack.files[voicePath] || null;
}
function playSegmentVoiceByIndex(idx){
  if(resourcePack.segmentVoiceAudio){
    resourcePack.segmentVoiceAudio.pause();
    resourcePack.segmentVoiceAudio = null;
  }
  const voiceUrl = getVoiceUrlByIndex(idx);
  if(!voiceUrl) return;
  const voiceAudio = new Audio(voiceUrl);
  resourcePack.segmentVoiceAudio = voiceAudio;
  if(resourcePack.bgmAudio){
    resourcePack.bgmAudio.volume = BGM_DUCK_VOLUME;
  }
  voiceAudio.play().catch(err=>{
    console.log("片段语音播放被浏览器拦截", err);
  });
  voiceAudio.onended = ()=>{
    if(resourcePack.bgmAudio){
      resourcePack.bgmAudio.volume = BGM_NORMAL_VOLUME;
    }
    resourcePack.segmentVoiceAudio = null;
  };
}
function getCurrentBgUrl(){
  if(!resourcePack.loaded) return null;
  const sceneBgMap = resourcePack.map?.sceneBg || {};
  const bgPath = sceneBgMap[sceneId];
  if(!bgPath) return null;
  return resourcePack.files[bgPath] || null;
}
function playSceneBGM(sid){
  if(!resourcePack.loaded) return;
  if(resourcePack.bgmAudio){
    resourcePack.bgmAudio.pause();
    resourcePack.bgmAudio = null;
  }
  const bgmPath = resourcePack.map?.bgm?.[sid];
  if(!bgmPath || !resourcePack.files[bgmPath]){
    document.getElementById("bgmPlayBtn").style.display = "none";
    return;
  }
  const audioUrl = resourcePack.files[bgmPath];
  resourcePack.bgmAudio = new Audio(audioUrl);
  resourcePack.bgmAudio.loop = true;
  resourcePack.bgmAudio.volume = BGM_NORMAL_VOLUME;
  document.getElementById("bgmPlayBtn").style.display = "block";
}
function triggerBGMPlay(){
  if(resourcePack.bgmAudio){
    resourcePack.bgmAudio.play().catch(e=>console.log("BGM播放失败",e));
  }
}
function startScene(id){
  sceneId = id;
  sceneData = scenes[id];
  const p = loadProgress();
  if(p && p.sceneId === id){
    index = p.index;
  }else{
    index = 0;
  }

  document.getElementById("menuPage").classList.remove("active");
  document.getElementById("storyPage").classList.add("active");
  initBgLayer();
  playSceneBGM(id);

  const bgUrl = getCurrentBgUrl();
  if(bgUrl){
    bgLayer.style.backgroundImage = `url(${bgUrl})`;
  }

  saveProgress();
  render();
  playSegmentVoiceByIndex(index);
  startCharacterLayoutWatch();
}
function startSceneFromBegin(id){
  sceneId = id;
  sceneData = scenes[id];
  index = 0;

  document.getElementById("menuPage").classList.remove("active");
  document.getElementById("storyPage").classList.add("active");
  initBgLayer();
  playSceneBGM(id);

  const bgUrl = getCurrentBgUrl();
  if(bgUrl){
    bgLayer.style.backgroundImage = `url(${bgUrl})`;
  }

  saveProgress();
  render();
  playSegmentVoiceByIndex(index);
  startCharacterLayoutWatch();
}
function resumeScene(){
  const p = loadProgress();
  if(!p){
    alert(uiLocale[currentLang].tipNoSave);
    return;
  }
  startScene(p.sceneId);
}
function exitStory(){
  if(resourcePack.segmentVoiceAudio){
    resourcePack.segmentVoiceAudio.pause();
    resourcePack.segmentVoiceAudio = null;
  }
  if(resourcePack.bgmAudio){
    resourcePack.bgmAudio.pause();
    resourcePack.bgmAudio = null;
  }
  document.getElementById("bgmPlayBtn").style.display = "none";
  clearBgLayer();
  clearCharacterImage();
  stopCharacterLayoutWatch();

  const layer = document.getElementById("charLayer");
  if(layer){
    layer.style.height = "";
    layer.style.width = "";
  }

  document.getElementById("storyPage").classList.remove("active");
  document.getElementById("menuPage").classList.add("active");
  loadProgress();
}
function render(){
  const box = document.getElementById("storyBox");
  box.innerHTML = "";
  clearCharacterImage();
  const dict = uiLocale[currentLang];
  if(index >= sceneData.content.length){
    box.innerHTML = `<div class='narration'>${dict.storyEnd}</div>`;
    document.getElementById("nextBtn").style.display = "none";
    updateCharacterLayout();
    return;
  }
  const item = sceneData.content[index];
  if(item.type === "narration"){
    box.innerHTML = `<div class="narration">${item.text}</div>`;
    document.getElementById("nextBtn").style.display = "block";
  }else if(item.type === "dialog"){
    box.innerHTML = `
      <div class="speaker">${item.speaker}</div>
      <div>${item.text}</div>
    `;
    document.getElementById("nextBtn").style.display = "block";
    setCharacter(item);
  }else if(item.type === "choice"){
    let html = `<div>${dict.textPleaseChoose}</div><div class="choice‑area">`;
    item.options.forEach(opt=>{
      html += `<button class="choice‑btn" onclick="selectChoice('${opt.key}')">${opt.text}</button>`;
    })
    html += `</div>`;
    box.innerHTML = html;
    document.getElementById("nextBtn").style.display = "none";
  }
  saveProgress();
  updateCharacterLayout();
}
function next(){
  index++;
  render();
  playSegmentVoiceByIndex(index);
}
function selectChoice(key){
  const item = sceneData.content[index];
  const selectedOpt = item.options.find(o => o.key === key);
  if(!selectedOpt) return;
  if(selectedOpt.targetScene){
    sceneId = selectedOpt.targetScene;
    sceneData = scenes[sceneId];
    index = selectedOpt.targetIndex ?? 0;
  }else if(selectedOpt.targetIndex !== undefined){
    index = selectedOpt.targetIndex;
  }else{
    index++;
  }
  saveProgress();
  render();
  playSegmentVoiceByIndex(index);
}
function exportSave(){
  const p = loadProgress();
  if(!p){
    alert(uiLocale[currentLang].tipNoSave);
    return;
  }
  const saveText = JSON.stringify(p,null,2);
  const blob = new Blob([saveText], {type:"text/plain"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "story_save.txt";
  a.click();
}
function importSave(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      const saveData = JSON.stringify(data);
      if(isIOS){
        setCookie("storyProgress", saveData);
      }else{
        localStorage.setItem("storyProgress", saveData);
      }
      loadProgress();
      alert(uiLocale[currentLang].tipImportOk);
    }catch(err){
      alert(uiLocale[currentLang].tipParseFail);
    }
  }
  reader.readAsText(file);
}
async function loadResourceZip(inputEl){
  const file = inputEl.files[0];
  if(!file) return;
  const zip = new JSZip();
  const dict = uiLocale[currentLang];
  try{
    await zip.loadAsync(file);
    resourcePack.files = {};
    const mapFile = zip.file("res_map.json");
    if(!mapFile){
      alert(dict.tipZipNoMap);
      return;
    }
    const mapText = await mapFile.async("string");
    resourcePack.map = JSON.parse(mapText);
    const allFileKeys = Object.keys(zip.files);
    for(const filePath of allFileKeys){
      const zipEntry = zip.files[filePath];
      if(!zipEntry.dir){
        const blob = await zipEntry.async("blob");
        resourcePack.files[filePath] = URL.createObjectURL(blob);
      }
    }
    resourcePack.loaded = true;
    const fontPath = resourcePack.map.global?.fontPath;
    if(fontPath && resourcePack.files[fontPath]){
      const fontUrl = resourcePack.files[fontPath];
      const fontFace = new FontFace("CustomStoryFont", `url(${fontUrl})`);
      await fontFace.load();
      document.fonts.add(fontFace);
      document.body.style.fontFamily = "CustomStoryFont, system‑ui, sans‑serif";
    }
    alert(dict.tipZipSuccess.replace("{count}",allFileKeys.length));
  }catch(err){
    console.error(err);
    alert(dict.tipZipLoadFail + err.message);
  }
}

document.addEventListener("DOMContentLoaded", async function(){
  let savedLang;
  if(isIOS){
    savedLang = getCookie("ui_lang")
  }else{
    savedLang = localStorage.getItem("ui_lang");
  }
  if(savedLang && uiLocale[savedLang]){
    currentLang = savedLang;
  }else{
    currentLang = detectBrowserLanguage();
  }

  await loadSceneJson(currentLang);
  applyUiLocale();
  renderSceneButtons();
  loadProgress();
})
</script>
